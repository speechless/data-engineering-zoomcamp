[project]
name = "data-engineering-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "briio-solutions", email = "briio-solutions@ig2i.centralelille.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.8",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[project.scripts]
data-engineering-zoomcamp = "data_engineering_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
